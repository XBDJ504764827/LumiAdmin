name: CI Checks

# PR 合并门禁：所有检查通过后才允许合并（需在仓库 Settings → Branches
# 中将这些检查设为 required status checks）
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  # ===== 前端检查：测试 + lint + 构建 =====
  frontend:
    name: frontend (test + lint + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: frontend

      - name: Test
        run: npm test
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  # ===== 后端检查：fmt + clippy + test + build =====
  backend:
    name: backend (fmt + clippy + test + build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lumiadmin_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lumiadmin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lumiadmin_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format Check
        run: cargo fmt --check
        working-directory: backend

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: backend

      - name: Test
        run: cargo test
        working-directory: backend

      - name: Build
        run: cargo build --release
        working-directory: backend
